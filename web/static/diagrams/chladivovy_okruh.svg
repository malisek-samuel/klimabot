<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<title id="t">Chladivový okruh split klimatizácie pri chladení</title>
<desc id="d">Vnútorná jednotka s výparníkom a vonkajšia jednotka s kompresorom, kondenzátorom a expanzným ventilom, spojené kvapalinovým a plynovým potrubím. Body 1 až 4 zodpovedajú bodom v ln p-h diagrame: 1 nasávanie kompresora, 2 výtlak kompresora, 3 výstup z kondenzátora, 4 za expanzným ventilom.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
</defs>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="50" y="40" font-size="22" font-weight="700" fill="#0f172a">Chladivový okruh klimatizácie — režim chladenia</text>
<text x="50" y="62" font-size="13.5" fill="#475569">Čísla 1–4 sú tie isté body ako v ln p-h diagrame. Červené a oranžové: vysoký tlak, modré a fialové: nízky tlak.</text>

<!-- units -->
<rect x="50" y="86" width="320" height="344" rx="18" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
<rect x="600" y="86" width="350" height="344" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="210" y="416" text-anchor="middle" font-size="15" font-weight="700" fill="#075985">Vnútorná jednotka (v miestnosti)</text>
<text x="775" y="416" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Vonkajšia jednotka (vonku)</text>

<!-- 4 → evaporator inlet: liquid line, low pressure after the valve -->
<polyline points="640,124 620,124 620,190 300,190" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linejoin="round"/>
<!-- evaporator coil (4→1) -->
<path d="M300 190 H120 V215 H300 V240 H120 V265 H300 V290 H120 V315 H300 V340" fill="none" stroke="#0284c7" stroke-width="5" stroke-linejoin="round"/>
<!-- 1 → compressor: suction gas line -->
<polyline points="300,340 656,340" fill="none" stroke="#0284c7" stroke-width="8"/>
<!-- 2: discharge to the condenser -->
<polyline points="690,306 690,146 790,146 790,160" fill="none" stroke="#ea580c" stroke-width="6" stroke-linejoin="round"/>
<!-- condenser coil (2→3) -->
<path d="M790 160 V300 H815 V160 H840 V300 H865 V160 H890 V300 H915 V160" fill="none" stroke="#dc2626" stroke-width="5" stroke-linejoin="round"/>
<!-- 3 → valve: high-pressure liquid -->
<polyline points="915,160 915,124 660,124" fill="none" stroke="#dc2626" stroke-width="4" stroke-linejoin="round"/>

<!-- flow arrows -->
<g stroke-width="4">
  <line x1="520" y1="190" x2="500" y2="190" stroke="#7c3aed" marker-end="url(#a)"/>
  <line x1="470" y1="340" x2="500" y2="340" stroke="#0284c7" marker-end="url(#a)"/>
  <line x1="690" y1="250" x2="690" y2="225" stroke="#ea580c" marker-end="url(#a)"/>
  <line x1="820" y1="124" x2="800" y2="124" stroke="#dc2626" marker-end="url(#a)"/>
</g>

<!-- compressor -->
<circle cx="690" cy="340" r="34" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
<path d="M672 356 L690 318 L708 356 Z" fill="#ea580c"/>
<text x="690" y="394" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">kompresor (1→2)</text>
<!-- expansion valve -->
<path d="M640 112 L660 136 L660 112 L640 136 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round"/>
<text x="672" y="104" font-size="13" font-weight="600" fill="#6d28d9">expanzný ventil (3→4)</text>
<text x="852" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">kondenzátor (2→3)</text>
<text x="210" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#075985">výparník (4→1)</text>

<!-- pipes between the units -->
<text x="485" y="176" text-anchor="middle" font-size="12.5" fill="#334155">kvapalinové potrubie (tenšie)</text>
<text x="485" y="366" text-anchor="middle" font-size="12.5" fill="#334155">plynové potrubie (hrubšie, izolované)</text>

<!-- heat -->
<line x1="62" y1="265" x2="110" y2="265" stroke="#f97316" stroke-width="5" marker-end="url(#a)"/>
<text x="84" y="236" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c2410c">teplo z</text>
<text x="84" y="250" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c2410c">miestnosti</text>
<line x1="925" y1="230" x2="988" y2="230" stroke="#dc2626" stroke-width="5" marker-end="url(#a)"/>
<text x="972" y="206" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b91c1c">teplo</text>
<text x="972" y="220" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b91c1c">von</text>

<!-- points -->
<g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
  <circle cx="620" cy="340" r="12" fill="#0f172a"/><text x="620" y="345">1</text>
  <circle cx="712" cy="200" r="12" fill="#0f172a"/><text x="712" y="205">2</text>
  <circle cx="915" cy="104" r="12" fill="#0f172a"/><text x="915" y="109">3</text>
  <circle cx="600" cy="160" r="12" fill="#0f172a"/><text x="600" y="165">4</text>
</g>

<!-- notes -->
<g font-size="13" fill="#334155">
  <text x="50" y="466">1→2 Kompresor stlačí studenú paru chladiva: tlak aj teplota prudko stúpnu.</text>
  <text x="50" y="488">2→3 V kondenzátore para odovzdá teplo vonkajšiemu vzduchu a skvapalní sa.</text>
  <text x="50" y="510">3→4 Expanzný ventil zníži tlak: kvapalina sa ochladí pod teplotu v miestnosti.</text>
  <text x="50" y="532">4→1 Vo výparníku sa chladivo vyparí a odoberie teplo vzduchu v miestnosti; vlhkosť skondenzuje a odtečie.</text>
</g>
<text x="50" y="554" font-size="12" fill="#475569">Pri kúrení štvorcestný ventil otočí smer toku: vnútorná jednotka je kondenzátor, vonkajšia výparník.</text>
</svg>
